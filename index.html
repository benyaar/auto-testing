<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Main page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #f0f0f0, #e0e0e0);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1,
        h4 {
            color: #333;
        }

        form {
            margin-top: 20px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        .footer-link {
            position: absolute;
            bottom: 50px;
            text-align: center;
        }

        .footer-link a {
            color: #326e35;
            text-decoration: none;
            font-weight: bold;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1>Welcome!</h1>
    <form action="/start-test" method="get">
        <button type="submit">Get test report</button>
    </form>
    <div class="footer-link">
        <a href="https://github.com/benyaar/auto-testing/tree/main" target="_blank">Auto-testing repo!</a>
    </div>
</body>

</html>
